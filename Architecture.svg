<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc"><title id="title">The SIS architecture</title><desc id="desc">Windows hosts the independent logger, PostgreSQL and dashboard, plus VirtualBox with a nested Proxmox host and three Ubuntu monitoring agents on a host-only network. Demo inputs use a separate simulated data source.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#426755"/></marker><style>text{font-family:Arial,sans-serif;fill:#24372c}.h{font-size:21px;font-weight:bold}.t{font-size:14px}.s{font-size:12px;fill:#647564}.box{fill:#fafaf4;stroke:#bac7b7;stroke-width:1.5}.line{stroke:#426755;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1100" height="670" fill="#f1f1e9"/><text x="40" y="48" class="h">The SIS · Academic monitoring architecture</text><text x="40" y="76" class="s">ASUS TUF F15 · 8 GB host RAM · Sequential actual VM testing</text><rect x="25" y="100" width="1050" height="540" rx="20" fill="#e5ecdf" stroke="#b6c5b0"/><text x="50" y="133" class="h">Windows host</text><rect class="box" x="50" y="160" width="280" height="90" rx="10"/><text x="70" y="190" class="h">Independent logger</text><text x="70" y="216" class="t">/health + /api/metrics · every 5s</text><text x="70" y="236" class="s">LIVE / SIMULATED states separated</text><path class="line" d="M190 250V280"/><rect class="box" x="50" y="285" width="280" height="85" rx="10"/><text x="70" y="315" class="h">PostgreSQL</text><text x="70" y="342" class="t">Readings · availability · severity events</text><path class="line" d="M190 370V405"/><rect class="box" x="50" y="410" width="280" height="95" rx="10"/><text x="70" y="440" class="h">The SIS dashboard</text><text x="70" y="465" class="t">127.0.0.1:5124 · Flask / Waitress</text><text x="70" y="487" class="s">Charts · CSV · notifications · sound</text><path class="line" d="M190 505V535"/><rect x="50" y="540" width="280" height="65" rx="10" fill="#e9e0f3" stroke="#bea4d0"/><text x="70" y="566" class="t">Fixed rules + per-VM demo inputs</text><text x="70" y="587" class="s">JSON configuration → logger next cycle</text><path d="M50 570H38V205H50" stroke="#73528c" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect class="box" x="510" y="160" width="530" height="90" rx="10"/><text x="535" y="191" class="h">VirtualBox · Proxmox-Lab</text><text x="535" y="218" class="t">Nested virtualization · host-only + NAT network</text><path class="line" d="M775 250V280"/><rect class="box" x="510" y="285" width="530" height="85" rx="10"/><text x="535" y="316" class="h">Proxmox VE · pve-lab</text><text x="535" y="343" class="t">192.168.56.10:8006 · manages three Ubuntu guests</text><path class="line" d="M775 370V400H592V426"/><path class="line" d="M775 400V426"/><path class="line" d="M775 400H960V426"/><rect class="box" x="510" y="430" width="165" height="120" rx="10"/><rect class="box" x="695" y="430" width="165" height="120" rx="10"/><rect class="box" x="880" y="430" width="160" height="120" rx="10"/><text x="525" y="460" class="h">VM 101</text><text x="710" y="460" class="h">VM 102</text><text x="895" y="460" class="h">VM 103</text><text x="525" y="488" class="t">192.168.56.21</text><text x="710" y="488" class="t">192.168.56.22</text><text x="895" y="488" class="t">192.168.56.23</text><text x="525" y="511" class="s">psutil agent · :5123</text><text x="710" y="511" class="s">psutil agent · :5123</text><text x="895" y="511" class="s">psutil agent · :5123</text><text x="525" y="532" class="s">CPU / RAM / root disk</text><text x="710" y="532" class="s">CPU / RAM / root disk</text><text x="895" y="532" class="s">CPU / RAM / root disk</text><path class="line" d="M330 205H405V575H775V553"/><text x="420" y="598" class="s">Host-only subnet 192.168.56.0/24 · agent requests from Windows</text><text x="50" y="625" class="s">SIMULATED demo uses the same running logger + PostgreSQL + viewer; its inputs do not power on or load guests.</text></svg>
